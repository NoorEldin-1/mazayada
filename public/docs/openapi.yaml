  /api/v1/commercial-register:
    get:
      summary: 'Register status'
      operationId: registerStatus
      description: "The user's Commercial Register state, the data on file, which scans are\npresent, and whether a (re)submit is currently allowed. `status` is null\nwhen nothing has been submitted yet."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'يلزم تسجيل الدخول.'
                properties:
                  message:
                    type: string
                    example: 'يلزم تسجيل الدخول.'
      tags:
        - 'Commercial Register'
      security: []
    post:
      summary: 'Submit the register'
      operationId: submitTheRegister
      description: "Creates or updates the user's Commercial Register (multipart) and moves it to\nPENDING for review. On a resubmission the previously uploaded scans are kept\nunless replaced, so a rejected user who only fixes a text field need not\nre-upload. A PENDING-under-review or APPROVED record is locked (403)."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses: {  }
      tags:
        - 'Commercial Register'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                company_name:
                  type: string
                  description: 'The company / trading entity name.'
                  example: 'Sarl Mazayada'
                register_number:
                  type: string
                  description: 'The commercial register number.'
                  example: '16/00-1234567 B 19'
                tax_number:
                  type: string
                  description: 'The tax identification number.'
                  example: '000116001234567'
                activity_type:
                  type: string
                  description: 'The registered commercial activity.'
                  example: 'تجارة السيارات'
                start_date:
                  type: string
                  description: 'The register issue (start) date (cannot be in the future).'
                  example: '2022-01-15'
                register_document:
                  type: string
                  format: binary
                  description: 'The commercial register scan (PDF/JPG/PNG). Required on first submission.'
                tax_card_document:
                  type: string
                  format: binary
                  description: 'The tax card scan (PDF/JPG/PNG). Required on first submission.'
              required:
                - company_name
                - register_number
                - tax_number
                - activity_type
                - start_date
      security: []
