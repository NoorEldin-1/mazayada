  /api/v1/my-auctions:
    get:
      summary: 'My auctions'
      operationId: myAuctions
      description: "The user's participations grouped by tab, each row carrying the viewer's own\nstate on that auction (highest bid, whether they lead it, deposit/book\nflags, final-payment status) — everything the screen needs without a\nfollow-up request per row.\n\nTabs are VIEWS over one set, not a partition: an auction can appear in more\nthan one (a won auction is also closed), and a participation whose auction\nwas later cancelled appears only under `all`. `all` is the exhaustive tab —\nuse it if you need every participation accounted for. Draft auctions are\nnever visible to citizens, so they cannot appear at all."
      parameters:
        -
          in: query
          name: tab
          description: 'One of all, active, won, lost, upcoming (default active).'
          example: active
          required: false
          schema:
            type: string
            description: 'One of all, active, won, lost, upcoming (default active).'
