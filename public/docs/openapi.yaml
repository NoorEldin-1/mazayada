  /api/v1/payments/callback:
    get:
      summary: 'Payment callback'
      operationId: paymentCallback
      description: "Gateway return URL for the MOBILE checkout. Confirms (or fails) the payment\nset for the reference and reports the resulting status. Idempotent — safe to\ncall more than once, and session-less, so it works inside a web view (the\nweb `payments.callback` sits behind `auth` and would redirect to the login\npage instead).\n\nThe client does not have to let this URL load: detecting the\n`/api/v1/payments/callback` prefix is enough to close the web view and poll\n`GET payments/{ref}/status`. The authoritative confirmation is the gateway's\nsigned server-to-server webhook either way."
      parameters:
        -
          in: query
          name: ref
          description: 'The gateway reference OR our payment id.'
          example: MOCK-ABC123
          required: true
          schema:
            type: string
            description: 'The gateway reference OR our payment id.'
            example: MOCK-ABC123
        -
          in: query
          name: decision
          description: 'The gateway decision (success|fail).'
          example: success
          required: false
          schema:
            type: string
            description: 'The gateway decision (success|fail).'
            example: success
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    ref: MOCK-ABC123
                    confirmed: false
                  message: 'لم تكتمل عملية الدفع.'
                  meta: {  }
                properties:
                  data:
                    type: object
                    properties:
                      ref:
                        type: string
                        example: MOCK-ABC123
                      confirmed:
                        type: boolean
                        example: false
                  message:
                    type: string
                    example: 'لم تكتمل عملية الدفع.'
                  meta:
                    type: object
                    properties: {  }
      tags:
        - Payments
      security: []
