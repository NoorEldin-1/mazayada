openapi: 3.0.3
info:
  title: 'Mazayada API Documentation'
  description: 'Mazayada mobile API (v1). Token-authenticated JSON API for the Flutter client covering auctions and the citizen dashboard. All responses use a unified envelope ({data, message, meta} on success; {message, errors} on error). Money is returned in dinars; send Accept-Language (ar|fr|en) to localize responses.'
  version: 1.0.0
servers:
  -
    url: 'https://mazayada.findosystem.com'
tags:
  -
    name: Appeals
    description: "\nCitizen appeals (الطعون) against an auction result. An appeal is filed from a\nspecific auction the user took part in, then routed through the platform admin\nand the organising entity. The client only ever sees the 3 public states\n(PENDING / APPROVED / REJECTED)."
  -
    name: 'Auction Q&A'
    description: "\nRegistered bidders asking written questions during the inspection window\n(§4 step 4). Answers are published by staff and surfaced via the public Q&A\nread endpoint."
  -
    name: 'Auction registration'
    description: "\nThe §4 flow: buy the condition book (a prerequisite that unlocks its\ndownload), then start paid registration (the participation deposit) via the\npayment gateway. Requires a verified (KYC-complete) account."
  -
    name: Auctions
    description: "\nPublic, read-only auction browsing. Money is returned in dinars; bidders are\nshown only by their deterministic alias."
  -
    name: Authentication
    description: "\nToken-based authentication for the mobile app. Mirrors the web auth flows\n(OTP email verification, enumeration-safe reset, secret-question recovery) but\nissues a Sanctum access + refresh token pair instead of a session. The shared\nOTP / user-creation logic lives in OtpService + RegisterCitizen so web and API\nstay in lock-step."
  -
    name: Bidding
    description: "\nPlacing bids. Requires a verified (KYC-complete) account and a paid\nregistration on the auction. Rate-limited per user per auction."
  -
    name: 'Commercial Register'
    description: "\nThe user's Commercial Register (السجل التجاري) submission. Mirrors the web flow:\nsubmit the register data plus two scans, an admin reviews it, and only an\nAPPROVED register unlocks participation in auctions flagged\n`requires_commerce_register`. Independent of KYC — a user may hold either, both\nor neither."
  -
    name: Dashboard
    description: "\nThe citizen's home summary and their participation history."
  -
    name: Devices
    description: "\nPush-notification device registry. The app registers its provider token here so\nthe platform can reach it, and unregisters on sign-out."
  -
    name: Documents
    description: "\nThe signed-in user's personal document library — every generated PDF tied to an\nauction they engaged with (condition book / award / receipt / delivery report),\nplus the policy-gated binary download. Streams from the private disk; access is\ngated by DocumentPolicy@download."
  -
    name: Endpoints
    description: ''
  -
    name: 'Financial Reports'
    description: "\nThe citizen's personal financial report (تقاريري المالية)."
  -
    name: KYC
    description: "\nIdentity verification: upload documents to the private disk, submit the profile\nfor review, and stream back the user's own documents. Mirrors the web KYC flow."
  -
    name: Notifications
    description: "\nThe citizen's in-app notification inbox."
  -
    name: Payments
    description: "\nThe winner's final payment plus the gateway return handling and a status\nendpoint the app polls after the gateway web view closes."
  -
    name: Profile
    description: "\nView and update the authenticated citizen's editable profile fields."
  -
    name: System
    description: "\nLightweight, unauthenticated endpoints to verify the API pipeline (routing,\nenvelope, locale, rate limiting) is wired correctly."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtain an <b>access token</b> from <code>POST /api/v1/auth/login</code> or <code>POST /api/v1/auth/verify-otp</code> and send it as <code>Authorization: Bearer &lt;access_token&gt;</code>. Access tokens are short-lived — use the <b>refresh token</b> at <code>POST /api/v1/auth/refresh</code> (send the refresh token as the bearer) to obtain a new pair.'
security:
  -
    default: []
paths:
  /api/v1/appeals:
    get:
      summary: 'List my appeals'
      operationId: listMyAppeals
      description: ''
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'يلزم تسجيل الدخول.'
                properties:
                  message:
                    type: string
                    example: 'يلزم تسجيل الدخول.'
      tags:
        - Appeals
      security: []
  '/api/v1/appeals/{id}':
    get:
      summary: 'Get an appeal'
      operationId: getAnAppeal
      description: 'Full detail for a single appeal owned by the authenticated user.'
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'يلزم تسجيل الدخول.'
                properties:
                  message:
                    type: string
                    example: 'يلزم تسجيل الدخول.'
      tags:
        - Appeals
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the appeal.'
        example: a216fb1d-403f-431b-bf29-b80079a51cbb
        required: true
        schema:
          type: string
  '/api/v1/auctions/{auction_id}/appeals':
    post:
      summary: 'Submit an appeal'
      operationId: submitAnAppeal
      description: "Files an appeal against the result of the given auction. Requires that the\nauction has closed, is still within the appeal window, and that the user\ntook part with at least one valid bid; only one appeal per auction."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses: {  }
      tags:
        - Appeals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  description: ''
                  example: 'اعتراض على نتيجة المزاد'
                reason:
                  type: string
                  description: ''
                  example: 'لم يتم احتساب مزايدتي الأخيرة.'
              required:
                - subject
                - reason
      security: []
    parameters:
      -
        in: path
        name: auction_id
        description: 'The ID of the auction.'
        example: a2050443-68af-41f5-8080-20d4b878c6ca
        required: true
        schema:
          type: string
      -
        in: path
        name: auction
        description: 'The auction to appeal.'
        example: a2164134-b1d3-404d-9399-dff76472ac26
        required: true
        schema:
          type: string
  '/api/v1/auctions/{auction_id}/questions':
    post:
      summary: 'Ask a question'
      operationId: askAQuestion
      description: 'Submit a question for staff to answer. Starts as PENDING and public.'
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses: {  }
      tags:
        - 'Auction Q&A'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                  description: 'The question text (max 1000).'
                  example: 'هل المركبة تعمل؟'
              required:
                - question
      security: []
    get:
      summary: 'Public Q&A'
      operationId: publicQA
      description: 'Answered, public inspection questions for an auction (asker not identified).'
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data: []
                  message: null
                  meta:
                    pagination:
                      current_page: 1
                      last_page: 1
                      per_page: 20
                      total: 0
                      count: 0
                properties:
                  data:
                    type: array
                    example: []
                  message:
                    type: string
                    example: null
                    nullable: true
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            example: 1
                          last_page:
                            type: integer
                            example: 1
                          per_page:
                            type: integer
                            example: 20
                          total:
                            type: integer
                            example: 0
                          count:
                            type: integer
                            example: 0
      tags:
        - Auctions
      security: []
    parameters:
      -
        in: path
        name: auction_id
        description: 'The ID of the auction.'
        example: a2050443-68af-41f5-8080-20d4b878c6ca
        required: true
        schema:
          type: string
  '/api/v1/auctions/{auction_id}/buy-book':
    post:
      summary: 'Buy the condition book'
      operationId: buyTheConditionBook
      description: "Creates the pending book-purchase payment and returns the gateway redirect\nURL. Buying the book unlocks its download and is a prerequisite for\nregistering. Open `redirect_url` in a web view, then re-fetch the auction.\n\nA 422 carries a stable `code` — branch on it rather than on the (translated)\nmessage: `book_free` and `already_bought_book` both mean \"go straight to\nregistration\"; `commerce_register_required` and `not_eligible` mean \"send the\nuser to the Commercial Register / KYC screen first\"."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'لقد اشتريت كراسة الشروط بالفعل.'
                  code: already_bought_book
                properties:
                  message:
                    type: string
                    example: 'لقد اشتريت كراسة الشروط بالفعل.'
                  code:
                    type: string
                    example: already_bought_book
      tags:
        - 'Auction registration'
      security: []
    parameters:
      -
        in: path
        name: auction_id
        description: 'The ID of the auction.'
        example: a2050443-68af-41f5-8080-20d4b878c6ca
        required: true
        schema:
          type: string
  '/api/v1/auctions/{auction_id}/register':
    post:
      summary: 'Start registration'
      operationId: startRegistration
      description: "Creates the pending deposit payment and returns the gateway redirect URL.\nThe condition book must already be purchased. Open `redirect_url` in a web\nview; once the gateway returns, poll `GET payments/{ref}/status` (or\nre-fetch the auction) to confirm.\n\nA 422 carries a stable `code`: `must_purchase_book` (go back a step),\n`already_registered` (proceed to bidding), `commerce_register_required`,\n`not_eligible`, `nothing_due`."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'يجب شراء كراسة الشروط أولاً قبل التسجيل في المزايدة.'
                  code: must_purchase_book
                properties:
                  message:
                    type: string
                    example: 'يجب شراء كراسة الشروط أولاً قبل التسجيل في المزايدة.'
                  code:
                    type: string
                    example: must_purchase_book
      tags:
        - 'Auction registration'
      security: []
    parameters:
      -
        in: path
        name: auction_id
        description: 'The ID of the auction.'
        example: a2050443-68af-41f5-8080-20d4b878c6ca
        required: true
        schema:
          type: string
  /api/v1/auctions:
    get:
      summary: 'List auctions'
      operationId: listAuctions
      description: "Paginated, filterable list of public auctions. The filter vocabulary is\nidentical to the web browse page (App\\Support\\AuctionFilters)."
      parameters:
        -
          in: query
          name: q
          description: 'Keyword — matches the title in any locale or the asset location.'
          example: سيارة
          required: false
          schema:
            type: string
            description: 'Keyword — matches the title in any locale or the asset location.'
            example: سيارة
        -
          in: query
          name: category
          description: 'Filter by category id.'
          example: consequatur
          required: false
          schema:
            type: string
            description: 'Filter by category id.'
            example: consequatur
        -
          in: query
          name: wilaya
          description: 'Filter by wilaya id.'
          example: 16
          required: false
          schema:
            type: integer
            description: 'Filter by wilaya id.'
            example: 16
        -
          in: query
          name: commune
          description: 'Filter by commune id.'
          example: 17
          required: false
          schema:
            type: integer
            description: 'Filter by commune id.'
            example: 17
        -
          in: query
          name: status
          description: 'User tokens (upcoming, live, closed) or raw enum values.'
          example: null
          required: false
          schema:
            type: array
            description: 'User tokens (upcoming, live, closed) or raw enum values.'
            example: null
            items:
              type: string
        -
          in: query
          name: type
          description: 'Auction type: SALE or LEASE.'
          example: SALE
          required: false
          schema:
            type: string
            description: 'Auction type: SALE or LEASE.'
            example: SALE
        -
          in: query
          name: asset_class
          description: 'One or more asset classes.'
          example: null
          required: false
          schema:
            type: array
            description: 'One or more asset classes.'
            example: null
            items:
              type: string
        -
          in: query
          name: condition
          description: 'One or more asset conditions.'
          example: null
          required: false
          schema:
            type: array
            description: 'One or more asset conditions.'
            example: null
            items:
              type: string
        -
          in: query
          name: requires_cr
          description: 'Commercial-register requirement (1 = required, 0 = not).'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Commercial-register requirement (1 = required, 0 = not).'
            example: true
        -
          in: query
          name: price_min
          description: 'Minimum opening price in dinars.'
          example: 100000
          required: false
          schema:
            type: integer
            description: 'Minimum opening price in dinars.'
            example: 100000
        -
          in: query
          name: price_max
          description: 'Maximum opening price in dinars.'
          example: 5000000
          required: false
          schema:
            type: integer
            description: 'Maximum opening price in dinars.'
            example: 5000000
        -
          in: query
          name: sort
          description: 'newest (default), price_asc, price_desc, most_bids, ending_soon.'
          example: ending_soon
          required: false
          schema:
            type: string
            description: 'newest (default), price_asc, price_desc, most_bids, ending_soon.'
            example: ending_soon
        -
          in: query
          name: per_page
          description: 'Items per page (1-50, default 12).'
          example: 12
          required: false
          schema:
            type: integer
            description: 'Items per page (1-50, default 12).'
            example: 12
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data: []
                  message: null
                  meta:
                    pagination:
                      current_page: 1
                      last_page: 1
                      per_page: 12
                      total: 0
                      count: 0
                properties:
                  data:
                    type: array
                    example: []
                  message:
                    type: string
                    example: null
                    nullable: true
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            example: 1
                          last_page:
                            type: integer
                            example: 1
                          per_page:
                            type: integer
                            example: 12
                          total:
                            type: integer
                            example: 0
                          count:
                            type: integer
                            example: 0
      tags:
        - Auctions
      security: []
  /api/v1/auctions/search:
    get:
      summary: 'Search auctions'
      operationId: searchAuctions
      description: "Lightweight autocomplete for the browse search box — the enveloped, dinar\nmobile counterpart of the web live-search dropdown. Returns up to 8 public\nauctions matching the term by title (any locale) or asset location. Requires\nat least 2 characters; a shorter term returns an empty list."
      parameters:
        -
          in: query
          name: q
          description: 'The search term (min 2 chars).'
          example: villa
          required: true
          schema:
            type: string
            description: 'The search term (min 2 chars).'
            example: villa
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data: []
                  message: null
                  meta: {  }
                properties:
                  data:
                    type: array
                    example: []
                  message:
                    type: string
                    example: null
                    nullable: true
                  meta:
                    type: object
                    properties: {  }
      tags:
        - Auctions
      security: []
  /api/v1/auctions/filters:
    get:
      summary: 'Filter options'
      operationId: filterOptions
      description: "The reference data the mobile browse screen needs to build its filter UI:\nactive categories, wilayas, and the enumerated token sets (status, type,\nasset class, condition, sort). Cached-friendly and locale-aware (names come\nfrom the localized accessor). Pass `wilaya` to also get that wilaya's communes."
      parameters:
        -
          in: query
          name: wilaya
          description: "Optionally include this wilaya's communes."
          example: 16
          required: false
          schema:
            type: integer
            description: "Optionally include this wilaya's communes."
            example: 16
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
