  /api/v1/verify:
    get:
      summary: 'Verify a document'
      operationId: verifyADocument
      description: "The JSON twin of the web `/verify` page, so the app's QR scanner can render\nthe result natively instead of opening a browser. The QR printed on every\ndocument encodes the web URL; take its `doc` and `sig` query parameters and\ncall this endpoint with them.\n\nDeliberately public and deliberately minimal: it answers \"was this paper\nissued by the platform and is it unaltered?\" and returns only what a holder\ncan already read off the sheet (type, auction title, issue date, amount) plus\na short signature fingerprint to compare. Never any personal data, and never\nthe document file — downloading still requires an authorised session.\n\nAn invalid or unknown pair returns HTTP 200 with `valid: false` (not a 404):\nfailing to verify IS the answer, and an error status would be indistinguishable\nfrom a network problem."
      parameters:
        -
          in: query
          name: doc
          description: 'The document id from the QR code.'
          example: 9b1f...
          required: true
          schema:
            type: string
            description: 'The document id from the QR code.'
            example: 9b1f...
        -
          in: query
          name: sig
          description: 'The signature from the QR code.'
          example: 4f3c...
          required: true
          schema:
            type: string
            description: 'The signature from the QR code.'
            example: 4f3c...
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
