      security: []
  /api/v1/devices:
    post:
      summary: 'Register this device'
      operationId: registerThisDevice
      description: "Claims a push token for the authenticated user. Idempotent — call it on\nevery launch and after every token refresh. If the token was previously\nregistered to a different account (a shared device, or a reinstall), it is\nre-pointed, so the previous owner stops receiving this device's push."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        204:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example: {  }
                properties: {  }
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'The provider (FCM) registration token.'
                  example: fMEP0b2sTk...
                platform:
                  type: string
                  description: 'ios or android.'
                  example: android
                locale:
                  type: string
                  description: 'The app UI language (ar|fr|en).'
                  example: ar
                  nullable: true
                app_version:
                  type: string
                  description: 'The client build, for diagnostics.'
                  example: 1.4.2
                  nullable: true
              required:
                - token
                - platform
      security: []
    delete:
      summary: 'Unregister this device'
      operationId: unregisterThisDevice
      description: "Removes the token so this device stops receiving push. Call it on sign-out.\nOnly the owner's own registration is removed — passing someone else's token\nis a no-op. Idempotent: an unknown token also returns 204."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        204:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example: {  }
                properties: {  }
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'The token to remove.'
                  example: fMEP0b2sTk...
              required:
                - token
      security: []
